<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>午間便當結算</title>
<style>
  :root{
    --bg: #2B2019;
    --bg-soft: #3A2C22;
    --paper: #FBF6EC;
    --paper-line: #E4D9C4;
    --ink: #2B2019;
    --ink-soft: #7A6A56;
    --stamp-red: #B23A2E;
    --stamp-green: #4F7A52;
    --stamp-amber: #B4802A;
    --accent: #C7622A;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--paper);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    min-height:100vh;
  }
  .mono{ font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; }

  .wrap{
    max-width: 460px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom: 18px;
    gap: 12px;
  }
  header h1{
    font-size: 1.3rem;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
    font-weight: 700;
  }
  header p{
    margin:0;
    font-size: 0.82rem;
    color: #C9B8A2;
  }
  .newday-btn{
    background: transparent;
    border: 1px solid #6B5A47;
    color: #D8C7B0;
    border-radius: 6px;
    padding: 7px 11px;
    font-size: 0.78rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .newday-btn:active{ background: var(--bg-soft); }

  .dateline{
    font-size: 0.78rem;
    color: #C9B8A2;
    margin: -8px 0 18px;
  }

  section.card{
    background: var(--bg-soft);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
  }
  section.card > summary, section.card > .card-title{
    font-size: 0.92rem;
    font-weight: 700;
    color: #F0E4D2;
    cursor: pointer;
    list-style: none;
    display:flex;
    justify-content: space-between;
    align-items: center;
  }
  section.card > summary::-webkit-details-marker{ display:none; }
  .caret{ transition: transform .15s; color:#C9B8A2; font-size: 0.8rem; }
  details[open] .caret{ transform: rotate(90deg); }

  .menu-list{ margin-top: 12px; display:flex; flex-direction:column; gap:8px; }
  .menu-row{
    display:flex; align-items:center; gap:8px;
  }
  .menu-row input[type=text]{ flex: 1.4; }
  .menu-row input[type=number]{ flex: 0.8; }
  .icon-btn{
    background:none; border:none; color:#A98F70;
    font-size: 1.1rem; cursor:pointer; padding: 2px 6px;
    line-height:1;
  }
  .icon-btn:active{ color: var(--stamp-red); }

  input, select{
    background: #2E241C;
    border: 1px solid #55442F;
    color: var(--paper);
    border-radius: 6px;
    padding: 8px 9px;
    font-size: 0.88rem;
    width: 100%;
  }
  input::placeholder{ color: #8A7860; }
  input:focus, select:focus{ outline: 2px solid var(--accent); outline-offset: 1px; }

  .add-menu-row{ display:flex; gap:8px; margin-top: 10px; }
  .add-menu-row input[type=text]{ flex: 1.4; }
  .add-menu-row input[type=number]{ flex: 0.8; }
  .primary-btn{
    background: var(--accent);
    color: #FBF6EC;
    border: none;
    border-radius: 6px;
    padding: 9px 14px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .primary-btn:active{ background: #A6501F; }

  .empty-note{
    color: #A98F70; font-size: 0.82rem; margin-top: 10px; line-height:1.6;
  }

  /* --- order entry form --- */
  .form-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }
  .form-grid .full{ grid-column: 1 / -1; }
  .field-label{
    font-size: 0.72rem;
    color: #B7A588;
    margin-bottom: 3px;
    display:block;
  }
  .form-grid > div{ display:flex; flex-direction:column; }
  .form-actions{ margin-top: 12px; display:flex; justify-content:flex-end; }

  /* --- receipt ticket --- */
  .receipt-wrap{ position: relative; margin: 26px 0; }
  .receipt{
    background: var(--paper);
    color: var(--ink);
    border-radius: 2px;
    padding: 18px 16px 14px;
    position: relative;
  }
  .zigzag{
    position:absolute; left:0; right:0; height:11px;
    background-image:
      linear-gradient(-45deg, var(--bg) 6px, transparent 0),
      linear-gradient(45deg, var(--bg) 6px, transparent 0);
    background-size: 12px 12px;
    background-repeat: repeat-x;
    background-position: 0 0;
  }
  .zigzag.top{ top: -10px; }
  .zigzag.bottom{ bottom: -10px; transform: rotate(180deg); }

  .receipt-title{
    text-align:center;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--paper-line);
  }

  .order-row{
    padding: 9px 0;
    border-bottom: 1px dashed var(--paper-line);
  }
  .order-row:last-child{ border-bottom: none; }
  .order-row-top{
    display:flex; justify-content:space-between; align-items:baseline; gap: 8px;
  }
  .order-row-name{ font-weight: 700; font-size: 0.92rem; }
  .order-row-item{ font-size: 0.78rem; color: var(--ink-soft); }
  .order-row-due{ font-weight:700; font-size: 0.95rem; }
  .order-row-mid{
    display:flex; justify-content:space-between; align-items:center;
    margin-top: 6px; gap: 8px;
  }
  .given-field{ display:flex; align-items:center; gap:6px; }
  .given-field label{ font-size: 0.74rem; color: var(--ink-soft); }
  .given-field input{
    width: 84px;
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--paper-line);
    padding: 5px 7px;
    font-size: 0.82rem;
  }
  .stamp{
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    display:inline-block;
    transform: rotate(-2deg);
    border: 1.5px solid currentColor;
  }
  .stamp.short{ color: var(--stamp-red); }
  .stamp.over{ color: var(--stamp-amber); }
  .stamp.even{ color: var(--stamp-green); }
  .stamp.pending{ color: var(--ink-soft); border-style:dashed; }
  .row-delete{
    background:none; border:none; color: var(--ink-soft);
    font-size: 0.95rem; cursor:pointer; padding: 0 2px;
  }
  .row-delete:active{ color: var(--stamp-red); }

  .receipt-empty{
    text-align:center; color: var(--ink-soft); font-size: 0.85rem;
    padding: 20px 0 6px;
  }

  /* --- summary --- */
  .summary-person{
    display:flex; justify-content:space-between; align-items:center;
    padding: 8px 0; border-bottom: 1px dashed var(--paper-line);
    font-size: 0.85rem;
  }
  .summary-person:last-of-type{ border-bottom:none; }
  .summary-person .name{ font-weight:700; }
  .summary-person .nums{ text-align:right; }
  .summary-person .due{ color: var(--ink-soft); font-size: 0.76rem; }

  .grand-total{
    margin-top: 12px; padding-top: 12px; border-top: 2px solid var(--ink);
    display:flex; flex-direction:column; gap: 5px; font-size: 0.9rem;
  }
  .grand-total .line{ display:flex; justify-content:space-between; }
  .grand-total .line.diff{ font-weight:700; }

  .banner{
    background: #4A3826;
    border: 1px solid #6B5237;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.82rem;
    color: #F0E4D2;
    margin-bottom: 16px;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .banner button{
    background: var(--accent); border:none; color:#fff;
    border-radius: 5px; padding: 6px 10px; font-size: 0.76rem;
    cursor:pointer; white-space:nowrap;
  }

  @media (max-width: 380px){
    .form-grid{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">

  <header>
    <div>
      <h1>午間便當結算</h1>
      <p>登記今天的便當，抓出誰少給、誰多給</p>
    </div>
    <button class="newday-btn" id="newDayBtn">新的一天</button>
  </header>
  <div class="dateline" id="dateLine"></div>

  <div id="dayBanner"></div>

  <details class="card" id="menuCard">
    <summary>
      <span>菜單（<span id="menuCount">0</span> 項）</span>
      <span class="caret">▸</span>
    </summary>
    <div class="menu-list" id="menuList"></div>
    <div class="empty-note" id="menuEmptyNote">尚未建立菜單。價格漲了就直接改這裡，之後登記會自動用新價格。</div>
    <div class="add-menu-row">
      <input type="text" id="newItemName" placeholder="品項名稱，例如：排骨便當">
      <input type="number" id="newItemPrice" placeholder="價格" min="0">
      <button class="primary-btn" id="addItemBtn">新增</button>
    </div>
  </details>

  <section class="card">
    <div class="card-title">登記一筆</div>
    <div class="form-grid">
      <div class="full">
        <span class="field-label">姓名</span>
        <input type="text" id="fName" placeholder="訂便當的人">
      </div>
      <div class="full">
        <span class="field-label">品項</span>
        <select id="fItem"></select>
      </div>
      <div>
        <span class="field-label">數量</span>
        <input type="number" id="fQty" value="1" min="1">
      </div>
      <div>
        <span class="field-label">單價（可改）</span>
        <input type="number" id="fPrice" min="0">
      </div>
      <div class="full">
        <span class="field-label">客人給的錢（沒收到可先留空）</span>
        <input type="number" id="fGiven" placeholder="例如：100" min="0">
      </div>
    </div>
    <div class="form-actions">
      <button class="primary-btn" id="addRowBtn">登記</button>
    </div>
  </section>

  <div class="receipt-wrap">
    <div class="zigzag top"></div>
    <div class="receipt">
      <div class="receipt-title">今日登記</div>
      <div id="orderRows"></div>
      <div class="receipt-empty" id="orderEmpty">還沒有登記，上面填一筆看看</div>
    </div>
    <div class="zigzag bottom"></div>
  </div>

  <section class="card">
    <div class="card-title">結算</div>
    <div id="summaryList" style="margin-top:10px;"></div>
    <div class="grand-total">
      <div class="line"><span>應收總計</span><span class="mono" id="totalDue">0 元</span></div>
      <div class="line"><span>已收總計</span><span class="mono" id="totalGiven">0 元</span></div>
      <div class="line diff"><span>差額</span><span class="mono" id="totalDiff">0 元</span></div>
    </div>
  </section>

</div>

<script>
const STORAGE_KEY = 'bento-calc-state';
const uid = () => Math.random().toString(36).slice(2, 10);
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const fmt = n => `${Math.round(n).toLocaleString()} 元`;

let state = {
  menu: [],
  order: { date: todayStr(), rows: [] }
};

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.menu = parsed.menu || [];
      state.order = parsed.order || { date: todayStr(), rows: [] };
    }
  }catch(e){
    // no saved state yet — start fresh
  }
  render();
}

async function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Storage error:', e);
  }
}

function checkDayBanner(){
  const banner = document.getElementById('dayBanner');
  if(state.order.date !== todayStr() && state.order.rows.length > 0){
    banner.innerHTML = `
      <div class="banner">
        <span>目前顯示的是 ${state.order.date} 的登記，要開始新的一天嗎？</span>
        <button id="bannerClearBtn">開始新的一天</button>
      </div>`;
    document.getElementById('bannerClearBtn').onclick = startNewDay;
  }else{
    banner.innerHTML = '';
  }
}

function startNewDay(){
  if(state.order.rows.length > 0 && !confirm('清空今天已登記的所有項目？')) return;
  state.order = { date: todayStr(), rows: [] };
  saveState();
  render();
}

// ---------- menu ----------
function renderMenu(){
  const list = document.getElementById('menuList');
  const empty = document.getElementById('menuEmptyNote');
  const count = document.getElementById('menuCount');
  const menuCard = document.getElementById('menuCard');
  count.textContent = state.menu.length;
  empty.style.display = state.menu.length ? 'none' : 'block';
  if(state.menu.length === 0) menuCard.open = true;

  list.innerHTML = '';
  state.menu.forEach(item => {
    const row = document.createElement('div');
    row.className = 'menu-row';
    row.innerHTML = `
      <input type="text" value="${escapeAttr(item.name)}" data-id="${item.id}" data-field="name">
      <input type="number" value="${item.price}" min="0" data-id="${item.id}" data-field="price">
      <button class="icon-btn" data-del="${item.id}" title="刪除">✕</button>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('change', e => {
      const id = e.target.dataset.id;
      const field = e.target.dataset.field;
      const item = state.menu.find(m => m.id === id);
      if(!item) return;
      item[field] = field === 'price' ? Number(e.target.value) || 0 : e.target.value;
      saveState();
      renderItemSelect();
    });
  });
  list.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.menu = state.menu.filter(m => m.id !== btn.dataset.del);
      saveState();
      render();
    });
  });
}

function renderItemSelect(){
  const sel = document.getElementById('fItem');
  const prevValue = sel.value;
  sel.innerHTML = state.menu.length
    ? state.menu.map(m => `<option value="${m.id}">${escapeHtml(m.name)}（${m.price} 元）</option>`).join('')
    : `<option value="">請先在菜單新增品項</option>`;
  if(state.menu.some(m => m.id === prevValue)) sel.value = prevValue;
  syncPriceField();
}

function syncPriceField(){
  const sel = document.getElementById('fItem');
  const priceField = document.getElementById('fPrice');
  const item = state.menu.find(m => m.id === sel.value);
  priceField.value = item ? item.price : '';
}

document.getElementById('addItemBtn').addEventListener('click', () => {
  const nameEl = document.getElementById('newItemName');
  const priceEl = document.getElementById('newItemPrice');
  const name = nameEl.value.trim();
  const price = Number(priceEl.value);
  if(!name || !priceEl.value){ nameEl.focus(); return; }
  state.menu.push({ id: uid(), name, price: price || 0 });
  nameEl.value = ''; priceEl.value = '';
  saveState();
  render();
});

document.getElementById('fItem').addEventListener('change', syncPriceField);

// ---------- order rows ----------
function addOrderRow(){
  const name = document.getElementById('fName').value.trim();
  const itemId = document.getElementById('fItem').value;
  const item = state.menu.find(m => m.id === itemId);
  const qty = Math.max(1, Number(document.getElementById('fQty').value) || 1);
  const unitPrice = Number(document.getElementById('fPrice').value) || 0;
  const givenRaw = document.getElementById('fGiven').value;
  const given = givenRaw === '' ? null : Number(givenRaw);

  if(!name){ document.getElementById('fName').focus(); return; }
  if(!item){ document.getElementById('fItem').focus(); return; }

  state.order.date = todayStr();
  state.order.rows.push({
    id: uid(), name, itemName: item.name, qty, unitPrice, given
  });

  document.getElementById('fName').value = '';
  document.getElementById('fGiven').value = '';
  document.getElementById('fQty').value = 1;
  saveState();
  render();
}
document.getElementById('addRowBtn').addEventListener('click', addOrderRow);

function statusFor(due, given){
  if(given === null || given === undefined || given === '') return { cls:'pending', label:'尚未收錢' };
  const diff = given - due;
  if(diff === 0) return { cls:'even', label:'已收齊' };
  if(diff < 0) return { cls:'short', label:`少給 ${fmt(-diff)}` };
  return { cls:'over', label:`多給 ${fmt(diff)}` };
}

function renderOrderRows(){
  const wrap = document.getElementById('orderRows');
  const empty = document.getElementById('orderEmpty');
  empty.style.display = state.order.rows.length ? 'none' : 'block';
  wrap.innerHTML = '';

  state.order.rows.forEach(row => {
    const due = row.qty * row.unitPrice;
    const status = statusFor(due, row.given);
    const el = document.createElement('div');
    el.className = 'order-row';
    el.innerHTML = `
      <div class="order-row-top">
        <div>
          <div class="order-row-name">${escapeHtml(row.name)}</div>
          <div class="order-row-item">${escapeHtml(row.itemName)} × ${row.qty}</div>
        </div>
        <div class="order-row-due mono">${fmt(due)}</div>
      </div>
      <div class="order-row-mid">
        <span class="stamp ${status.cls}">${status.label}</span>
        <div class="given-field">
          <label>收到</label>
          <input type="number" min="0" placeholder="—" value="${row.given ?? ''}" data-given="${row.id}">
          <button class="row-delete" data-del="${row.id}" title="刪除">✕</button>
        </div>
      </div>
    `;
    wrap.appendChild(el);
  });

  wrap.querySelectorAll('[data-given]').forEach(inp => {
    inp.addEventListener('change', e => {
      const r = state.order.rows.find(r => r.id === e.target.dataset.given);
      if(!r) return;
      r.given = e.target.value === '' ? null : Number(e.target.value);
      saveState();
      render();
    });
  });
  wrap.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.order.rows = state.order.rows.filter(r => r.id !== btn.dataset.del);
      saveState();
      render();
    });
  });
}

// ---------- summary ----------
function renderSummary(){
  const grouped = {};
  state.order.rows.forEach(row => {
    const due = row.qty * row.unitPrice;
    if(!grouped[row.name]) grouped[row.name] = { due: 0, given: 0, hasGiven: false };
    grouped[row.name].due += due;
    if(row.given !== null && row.given !== undefined){
      grouped[row.name].given += row.given;
      grouped[row.name].hasGiven = true;
    }
  });

  const list = document.getElementById('summaryList');
  const names = Object.keys(grouped);
  if(names.length === 0){
    list.innerHTML = `<div class="empty-note">還沒有可以結算的項目</div>`;
  }else{
    list.innerHTML = names.map(name => {
      const g = grouped[name];
      const status = g.hasGiven ? statusFor(g.due, g.given) : { cls:'pending', label:'尚未收錢' };
      return `
        <div class="summary-person">
          <div>
            <div class="name">${escapeHtml(name)}</div>
            <div class="due">應收 ${fmt(g.due)}</div>
          </div>
          <div class="nums">
            <span class="stamp ${status.cls}">${status.label}</span>
          </div>
        </div>`;
    }).join('');
  }

  const totalDue = state.order.rows.reduce((s,r) => s + r.qty * r.unitPrice, 0);
  const totalGiven = state.order.rows.reduce((s,r) => s + (r.given ?? 0), 0);
  const totalDiff = totalGiven - totalDue;

  document.getElementById('totalDue').textContent = fmt(totalDue);
  document.getElementById('totalGiven').textContent = fmt(totalGiven);
  const diffEl = document.getElementById('totalDiff');
  diffEl.textContent = totalDiff === 0 ? '0 元（收齊）' : (totalDiff < 0 ? `少 ${fmt(-totalDiff)}` : `多 ${fmt(totalDiff)}`);
  diffEl.style.color = totalDiff === 0 ? 'var(--stamp-green)' : (totalDiff < 0 ? 'var(--stamp-red)' : 'var(--stamp-amber)');
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

function render(){
  document.getElementById('dateLine').textContent = `日期：${state.order.date}`;
  checkDayBanner();
  renderMenu();
  renderItemSelect();
  renderOrderRows();
  renderSummary();
}

document.getElementById('newDayBtn').addEventListener('click', startNewDay);

loadState();
</script>
</body>
</html>
